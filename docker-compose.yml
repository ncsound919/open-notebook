services:
  surrealdb:
    image: surrealdb/surrealdb:v2
    command: start --log info --user root --pass root rocksdb:/mydata/mydatabase.db
    user: root  # Required for bind mounts on Linux
    ports:
      - "8000:8000"
    volumes:
      - ./surreal_data:/mydata
    environment:
      - SURREAL_EXPERIMENTAL_GRAPHQL=true
    restart: always
    pull_policy: always

  open_notebook:
    image: lfnovo/open_notebook:v1-latest
    ports:
      - "8502:8502"  # Web UI
      - "5055:5055"  # REST API
    environment:
      # REQUIRED: Change this to your own secret string
      # This encrypts your API keys in the database
      - OPEN_NOTEBOOK_ENCRYPTION_KEY=change-me-to-a-secret-string

      # Database connection (default values - no need to change)
      - SURREAL_URL=ws://surrealdb:8000/rpc
      - SURREAL_USER=root
      - SURREAL_PASSWORD=root
      - SURREAL_NAMESPACE=open_notebook
      - SURREAL_DATABASE=open_notebook
    volumes:
      - ./notebook_data:/app/data
    depends_on:
      - surrealdb
    restart: always
    pull_policy: always

  # ---- OSS voice lane (optional profiles; default compose is unchanged) ----
  # Preset voices, CPU-only, no cloning:
  #   docker compose --profile oss-voices up tts-kokoro
  # Your-voice cloning, needs NVIDIA GPU:
  #   docker compose --profile oss-voices --profile oss-clone up
  tts-kokoro:
    image: remsky/kokoro-fastapi-cpu:latest
    profiles: ["oss-voices"]
    ports:
      - "8001:8000"
    environment:
      - USE_GPU=false
    volumes:
      - ./tts_data/kokoro:/app/api/src/voices
    restart: unless-stopped

  tts-f5:
    image: ghcr.io/openttsgroup/f5-tts-open-tts:latest
    profiles: ["oss-voices", "oss-clone"]
    ports:
      - "8002:8000"
    environment:
      - VOICES_DIR=/voices
      - MAX_CONCURRENCY=1
    volumes:
      - ./tts_data/f5-voices:/voices
      - ./tts_data/f5-cache:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
